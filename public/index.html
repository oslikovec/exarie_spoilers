<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8" />
<title>Exarie Spoiler Machine – Ultra Troll Edition</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  body {
    background: #000;
    color: white;
    text-align: center;
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    overflow: hidden;
  }

  /* 🔵 Neon Modré pozadí */
  #backgroundCanvas {
    position: fixed;
    inset: 0;
    z-index: -1;
  }

  h1 {
    margin-top: 30px;
    font-size: 2.4rem;
    letter-spacing: 4px;
    color: #ffe066;
  }

  .container {
    margin-top: 25px;
    display: flex;
    justify-content: space-around;
    flex-wrap: wrap;
    padding: 15px;
  }

  .img-box {
    max-width: 30%;
    min-width: 250px;
  }

  .img-box img {
    width: 100%;
    border-radius: 10px;
    border: 3px solid #333;
  }

.button-center {
  width: 100%;
  display: flex;
  justify-content: center;
  margin-top: -530px; /* bylo 40px */
}


button {
  padding: 15px 30px;
  font-size: 20px;
  background: #ff0066;
  color: white;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  transition: 0.2s;
  display: inline-block;  /* FIX */
  width: auto;            /* FIX */
  margin: 0;              /* FIX */
}


  button:hover {
    background: #ff3385;
    transform: scale(1.07);
  }

  /* OVERLAY – SPOILERY */
  #overlay {
    position: fixed;
    inset: 0;
    background: black;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 999;
    text-align: center;
    animation: fadeIn 0.3s ease-out;
  }

  #text {
    font-size: 2rem;
    max-width: 90%;
  }

  @keyframes fadeIn {
    from { opacity: 0; } to { opacity: 1; }
  }

#barWrapper {
  height: 40px;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: opacity .3s;
  margin: 0;           /* DŮLEŽITÉ */
  padding: 0;          /* DŮLEŽITÉ */
}

  #bar {
    width: 60%;
    height: 25px;
    border: 2px solid white;
    margin-top: 0px;
    border-radius: 4px;
    overflow: hidden;
    transition: opacity .4s;
  }

  #fill {
    width: 0%;
    height: 100%;
    background: #0f0;
    transition: width 0.4s linear;
  }

  /* Glitch */
  .glitch {
    animation: glitch 0.4s infinite;
  }

  @keyframes glitch {
    0% { text-shadow: 2px 0 red, -2px 0 cyan; }
    50% { text-shadow: -2px 0 red, 2px 0 cyan; }
    100% { text-shadow: 2px 0 red, -2px 0 cyan; }
  }

  /* Flash */
  #flash {
    position: fixed;
    inset: 0;
    background: white;
    display: none;
    z-index: 2000;
  }

#overlayContent {
  display: flex;
  flex-direction: column;
  align-items: center;
}



</style>
</head>

<body>

<!-- 🔵 CANVAS PRO POZADÍ A SHARDY -->
<canvas id="backgroundCanvas"></canvas>

<h1>EXARIE SPOILER SIMULÁTOR</h1>

<div class="container">
  <div class="img-box">
    <img src="exarie1.jpg" alt="Exarie 1">
  </div>

  <div class="img-box">
    <img src="exarie.jpg" alt="Exarie panorama">
  </div>

  <div class="img-box">
    <img src="exarie2.jpg" alt="Exarie 2">
  </div>
</div>

<div class="button-center">
  <button onclick="startSpoilers()">CELÁ SPOILNUTÁ KNÍŽKA</button>
</div>


<div id="overlay">
  <div id="overlayContent">
    <div id="text">3</div>
    <div id="barWrapper">
      <div id="bar"><div id="fill"></div></div>
    </div>
  </div>
</div>



<div id="flash"></div>


<script>

/* ============================================================
      🔵 BLUE NEON BACKGROUND PARTICLES
============================================================ */
const canvas = document.getElementById("backgroundCanvas");
const ctx = canvas.getContext("2d");

let w, h;
function resize() {
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

let particles = [];
for (let i = 0; i < 80; i++) {
  particles.push({
    x: Math.random() * w,
    y: Math.random() * h,
    size: Math.random() * 3 + 1,
    speedX: (Math.random() - 0.5) * 0.5,
    speedY: (Math.random() - 0.5) * 0.5,
  });
}

function backgroundAnim() {
  ctx.clearRect(0, 0, w, h);
  ctx.shadowColor = "#33aaff";
  ctx.shadowBlur = 15;

  particles.forEach(p => {
    ctx.fillStyle = "#33bbff";
    ctx.fillRect(p.x, p.y, p.size, p.size);
    p.x += p.speedX;
    p.y += p.speedY;
    if (p.x < 0) p.x = w;
    if (p.x > w) p.x = 0;
    if (p.y < 0) p.y = h;
    if (p.y > h) p.y = 0;
  });

  requestAnimationFrame(backgroundAnim);
}
backgroundAnim();


/* ============================================================
      🔵 CURSOR SHARD EFFECT
============================================================ */
let shards = [];

window.addEventListener("mousemove", e => {
  for (let i = 0; i < 5; i++) {
    shards.push({
      x: e.clientX,
      y: e.clientY,
      size: Math.random() * 4 + 2,
      speedX: (Math.random() - 0.5) * 4,
      speedY: (Math.random() - 0.5) * 4,
      alpha: 1
    });
  }
});

function shardAnim() {
  ctx.shadowBlur = 0;

  shards.forEach((s, index) => {
    ctx.fillStyle = `rgba(0,180,255,${s.alpha})`;
    ctx.fillRect(s.x, s.y, s.size, s.size);
    s.x += s.speedX;
    s.y += s.speedY;
    s.alpha -= 0.03;
    if (s.alpha <= 0) shards.splice(index, 1);
  });

  requestAnimationFrame(shardAnim);
}
shardAnim();


/* ============================================================
      SPOILER LOGIC — upraveno podle tvého přání ❤️
============================================================ */

function startSpoilers() {
  const overlay = document.getElementById("overlay");
  const text = document.getElementById("text");
  const bar = document.getElementById("fill");
  const barWrapper = document.getElementById("barWrapper");

  overlay.style.display = "flex";

  const phases = [
    "Nabíjím spoilery...",
    "Hackuju Startovač...",
    "Probíjím se skrze Sterakovo čelo...",
    "Navazuju spojení s Exarií...",
    "Dekóduju kompletní děj knihy...",
    "Kontroluju autorská práva... (oh no)",
    "Poslední přípravy..."
  ];

  let i = 0;

  function loadPhase() {
    if (i < phases.length) {
      text.textContent = phases[i];
      bar.style.width = ((i + 1) / phases.length * 100) + "%";
      text.classList.add("glitch");
      setTimeout(() => {
        text.classList.remove("glitch");
        i++;
        setTimeout(loadPhase, 700);
      }, 300);
    } else {
      dramaticMoment();
    }
  }

  loadPhase();
}

function dramaticMoment() {
  const text = document.getElementById("text");
  const barWrapper = document.getElementById("barWrapper");

  barWrapper.style.opacity = "0";

  setTimeout(() => {
    barWrapper.style.display = "none";
  }, 400);

  setTimeout(() => text.textContent = "TOTO JE POSLEDNÍ ŠANCE ODEJÍT...", 700);

  setTimeout(() => {
    text.textContent = "ODHALUJU KOMPLETNÍ DĚJ EXARIE...";
    text.classList.add("glitch");
  }, 2000);

  setTimeout(() => finalExplosion(), 3500);
}

function finalExplosion() {
  const overlay = document.getElementById("overlay");
  const text = document.getElementById("text");
  const flash = document.getElementById("flash");

  flash.style.display = "block";
  setTimeout(() => flash.style.display = "none", 200);

  overlay.style.animation = "shake 0.5s";

  setTimeout(() => {
    text.classList.remove("glitch");
    text.style.fontSize = "2.4rem";
    text.textContent = "no ... ...  ... zase tak moc dobrej nejsem :D ";
  }, 200);

  setTimeout(() => {
    overlay.style.display = "none";
    overlay.style.animation = "";
    text.style.fontSize = "2rem";
  }, 2500);
}
</script>

</body>
</html>
